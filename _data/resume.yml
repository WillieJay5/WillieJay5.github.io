      - "Fixed LDAP/Active Directory sync errors where a misscoped base filter pulled in the wrong user population; wrote a three-part triage framework now used to train new engineers."
      - "Support Cisco CUCM and Webex Calling environments, including SIP trunks, SNMP, and CTIManager service health."
      - "Escalate to L3 and development with complete evidence and written summaries; separate true defects from feature requests and out-of-scope work."
      - "Write internal KB articles, canned responses, and troubleshooting frameworks; mentored a newer engineer on structured troubleshooting."


    startDate: "2026-09-30"
    summary: >
      A segmented security lab built from a threat model, with every build
      published as a reproducible writeup.
    highlights:
      - "Designed a segmented lab on Proxmox VE behind a bare-metal OPNsense firewall, with separate management, lab, and user VLANs and no outbound internet from the management zone."
      - "Deployed a Graylog SIEM on Debian behind an Nginx reverse proxy with TLS from Certbot and Cloudflare DNS validation."
      - "Stood up a Cowrie SSH honeypot in the isolated lab VLAN to capture real brute-force attempts as detection source data."
      - "Built an end-to-end Cowrie-to-Graylog pipeline: GELF HTTP input, dedicated index set, input-based stream routing, and a pipeline rule that parses raw JSON into searchable fields."


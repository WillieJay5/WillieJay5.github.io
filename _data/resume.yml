work:
  - company: "Singlewire Software"
    position: "Technical Support Specialist"
    website: "https://www.singlewire.com/"
    startDate: "2025-05-05"
    summary: >
      Escalated technical support for InformaCast emergency mass-notification
      systems used by schools, county governments, and hospitals.
    highlights:
      - "Triage and resolve escalated incidents where downtime carries life-safety impact."
      - "Root-caused outages from log bundles, syslog, HAR files, and SAML tracer exports, including a server disk-exhaustion outage traced to SIP device syslog errors and several IdP/SSO authentication failures."
